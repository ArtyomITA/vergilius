<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vergilius</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4L16 22L6 22Z' fill='%23c678dd'/%3E%3Cpath d='M16 8L16 22L24 22Z' fill='%23c678dd' opacity='0.6'/%3E%3Cpath d='M4 24Q10 20 16 24Q22 28 28 24' stroke='%23c678dd' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* Stessa skin di Odysseus (tema "cyberpunk": fondo quasi nero, griglia synapse,
     Fira Code, accento viola). I valori sono quelli del tema di default di
     Odysseus per quel look: se l'utente ha personalizzato, la pagina del boot
     e' comunque coerente perche' vive un istante prima di Odysseus stesso. */
  @font-face { font-family: 'Fira Code'; font-weight: 400; font-display: swap; src: url('http://127.0.0.1:7000/static/fonts/FiraCode-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Fira Code'; font-weight: 600; font-display: swap; src: url('http://127.0.0.1:7000/static/fonts/FiraCode-SemiBold.woff2') format('woff2'); }
  :root {
    --bg: #0a0a0f; --fg: #9cdef2; --panel: #0e0e16; --border: #5b2b8a;
    --brand: #c678dd; --accent: #22d3ee; --dim: color-mix(in srgb, var(--fg) 55%, transparent);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Fira Code', ui-monospace, Consolas, monospace;
    background: var(--bg); color: var(--fg);
    background-image:
      linear-gradient(color-mix(in srgb, var(--fg) 3.5%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--fg) 3.5%, transparent) 1px, transparent 1px);
    background-size: 24px 24px; background-attachment: fixed;
    /* La PAGINA scorre, mai la scheda: con "safe center" il contenuto piu' alto
       della finestra parte dall'alto invece di essere tagliato in cima. */
    display: grid; justify-items: center; align-content: safe center;
    min-height: 100dvh; padding: 24px;
  }
  /* scintille come nello sfondo di Odysseus */
  .sparks { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .sparks i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 6px var(--accent); opacity: 0; animation: spark 6s ease-in-out infinite; }
  @keyframes spark { 0%,100% { opacity: 0; transform: scale(.4) } 50% { opacity: .9; transform: scale(1) } }

  .card {
    position: relative; z-index: 1;
    width: min(940px, 100%);
    background: var(--panel); border: 1px solid var(--brand); border-radius: 14px;
    padding: 28px 34px 26px;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--brand) 25%, transparent), 0 0 60px color-mix(in srgb, var(--brand) 18%, transparent), 0 30px 90px rgba(0,0,0,.7);
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px; }
  .brand svg { width: 34px; height: 34px; }
  .brand b {
    font-size: 2.1rem; font-weight: 600; letter-spacing: .04em;
    background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 60%, var(--fg)));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { text-align: center; color: var(--dim); font-size: .9rem; margin-bottom: 20px; }

  [hidden] { display: none !important; }   /* serve: .profili ha un display esplicito */
  .profili { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .p {
    text-align: left; cursor: pointer; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 10px; padding: 18px 16px 16px;
    font-family: inherit; transition: border-color .15s, box-shadow .15s, transform .15s;
    display: flex; flex-direction: column; gap: 8px; min-height: 150px;
  }
  .p:hover, .p:focus-visible { border-color: var(--brand); box-shadow: 0 0 24px color-mix(in srgb, var(--brand) 25%, transparent); transform: translateY(-1px); outline: none; }
  .p:disabled { opacity: .5; cursor: wait; transform: none; }
  .p .n { font-weight: 600; font-size: 1.02rem; color: var(--brand); }
  .p .d { font-size: .8rem; color: var(--fg); line-height: 1.45; }
  .p .i { font-size: .72rem; color: var(--dim); line-height: 1.4; margin-top: auto; }
  .p .k { display: inline-block; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 4px; padding: 1px 6px; width: max-content; }

  /* loader: stesso dial del gate ShadowBroker (conic-gradient + anello che gira), palette Odysseus */
  .loader { display: none; grid-template-columns: 190px 1fr; gap: 34px; align-items: center; }
  .loader.on { display: grid; }
  .profili:not([hidden]) + .loader.on { margin-top: 22px; }
  .dial { position: relative; width: 170px; height: 170px; display: grid; place-items: center; border-radius: 50%;
    background: conic-gradient(var(--brand) var(--p, 0deg), color-mix(in srgb, var(--brand) 14%, transparent) 0);
    box-shadow: 0 0 48px color-mix(in srgb, var(--brand) 22%, transparent); }
  .dial::before { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: var(--panel); }
  .dial::after { content: ''; position: absolute; inset: -6px; border-radius: 50%;
    border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent); animation: spin 8s linear infinite; }
  .dial b { position: relative; font-size: 2rem; font-weight: 600; color: var(--fg); }
  .dial small { position: absolute; bottom: 38px; font-size: .62rem; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
  @keyframes spin { to { transform: rotate(360deg) } }
  /* Righe compatte e, sugli schermi larghi, due colonne: cosi' anche il profilo
     "full" (14 componenti) sta nella finestra senza barra di scorrimento. */
  .comp { list-style: none; display: grid; gap: 6px; }
  @media (min-width: 900px) { .comp { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 10px; } }
  .comp li { display: flex; align-items: center; gap: 8px; font-size: .78rem; padding: 5px 9px;
    border: 1px solid color-mix(in srgb, var(--border) 60%, transparent); border-radius: 7px; background: var(--bg); }
  .comp .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; background: var(--dim); }
  .comp li.loading .dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .comp li.ready .dot { background: #50fa7b; box-shadow: 0 0 8px #50fa7b; }
  .comp li.error .dot { background: #ff5370; box-shadow: 0 0 8px #ff5370; }
  .comp li.ready { color: var(--dim); }
  .comp .lb { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comp .dt { font-size: .68rem; color: var(--dim); white-space: nowrap; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.7) } }
  .fase { margin-top: 14px; font-size: .78rem; color: var(--dim); }
  .err { display: none; margin-top: 16px; padding: 10px 12px; border: 1px solid #ff5370; border-radius: 7px; color: #ff8aa0; font-size: .82rem; }
  .err.on { display: block; }
  /* riga di suggerimento per un componente lento (feed esterni) */
  .hint { display: none; margin-top: 8px; font-size: .74rem; line-height: 1.45; color: var(--accent); }
  .hint.on { display: block; }
  /* stato "pronto": conto alla rovescia e scelta, invece del salto automatico */
  .apri { display: none; margin-top: 14px; align-items: center; gap: 10px; flex-wrap: wrap; }
  .apri.on { display: flex; }
  .b {
    font-family: inherit; font-size: .8rem; font-weight: 600; cursor: pointer;
    color: var(--brand); background: transparent; text-decoration: none;
    border: 1px solid var(--brand); border-radius: 8px; padding: 9px 16px;
  }
  .b:hover, .b:focus-visible { background: color-mix(in srgb, var(--brand) 15%, transparent); outline: none; }
  .b.quieto { color: var(--dim); border-color: var(--border); }
  .b.quieto:hover, .b.quieto:focus-visible { background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg); }
  .b:disabled { opacity: .5; cursor: wait; }
  /* avviso sopra la scelta profilo quando si torna indietro da uno stack acceso */
  .avviso { display: none; margin-bottom: 14px; padding: 10px 12px; font-size: .78rem; line-height: 1.5;
    border: 1px solid var(--accent); border-radius: 7px; color: var(--fg);
    background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .avviso.on { display: block; }
  .foot { margin-top: 22px; text-align: center; font-size: .7rem; color: var(--dim); }
  @media (max-width: 640px) { .loader { grid-template-columns: 1fr; justify-items: center; } .card { padding: 26px 20px; } }
</style>
</head>
<body>
<div class="sparks" id="sparks"></div>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4L16 22L6 22Z" fill="#c678dd"/><path d="M16 8L16 22L24 22Z" fill="#c678dd" opacity="0.6"/><path d="M4 24Q10 20 16 24Q22 28 28 24" stroke="#c678dd" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
    <b>Vergilius</b>
  </div>
  <div class="sub" id="sub">Controllo lo stato…</div>

  <div class="avviso" id="avviso"></div>

  <!-- Nascosta all'avvio: si mostra solo quando /api/status dice phase=choose,
       cosi' non si puo' cliccare un profilo su uno stack gia' acceso. -->
  <div class="profili" id="profili" hidden>
    <button class="p" data-p="shadowbroker">
      <span class="k">solo intelligence</span>
      <span class="n">ShadowBroker</span>
      <span class="d">Dashboard, mappa, radio e SIGINT, tutti i feed OSINT.</span>
      <span class="i">Nessun modello caricato. Più leggero.</span>
    </button>
    <button class="p" data-p="vergilius-chat">
      <span class="k">solo cervello</span>
      <span class="n">Vergilius Chat</span>
      <span class="d">Modello locale + memoria e RAG. La chat completa, senza ShadowBroker.</span>
      <span class="i">Router modelli, memoria vettoriale, assistente. Niente Intelligence/Financial.</span>
    </button>
    <button class="p" data-p="vergilius-lite">
      <span class="k">consigliato</span>
      <span class="n">Vergilius Lite</span>
      <span class="d">Chat + ShadowBroker: intelligence, finanza, mappa dentro la chat.</span>
      <span class="i">Tutto tranne voce e Avatar 2D.</span>
    </button>
    <button class="p" data-p="full">
      <span class="k">tutto</span>
      <span class="n">Full</span>
      <span class="d">Lite + voce (STT/TTS, ponte vocale) + Avatar 2D.</span>
      <span class="i">Il più pesante: PocketTTS e voce live.</span>
    </button>
  </div>

  <div class="loader" id="loader">
    <div class="dial" id="dial" style="--p:0deg"><b id="pct">0%</b><small id="pname"></small></div>
    <div>
      <ul class="comp" id="comp"></ul>
      <div class="fase" id="fase"></div>
      <div class="hint" id="hint"></div>
      <div class="apri" id="apri">
        <a class="b" id="apri-a" href="#">Apri Vergilius ora</a>
        <button class="b quieto" id="resta" type="button">Resta qui</button>
        <button class="b quieto" id="cambia" type="button">Cambia profilo</button>
      </div>
    </div>
  </div>
  <div class="err" id="err"></div>
  <div class="foot">ShadowBroker :3000 · Vergilius :7000 · questo boot :7001</div>
</div>

<script>
(function () {
  var sp = document.getElementById('sparks');
  for (var i = 0; i < 28; i++) {
    var e = document.createElement('i');
    e.style.left = Math.random() * 100 + 'vw'; e.style.top = Math.random() * 100 + 'vh';
    e.style.animationDelay = (Math.random() * 6) + 's'; e.style.animationDuration = (4 + Math.random() * 5) + 's';
    sp.appendChild(e);
  }
  var NOMI = { 'shadowbroker': 'ShadowBroker', 'vergilius-chat': 'Vergilius Chat', 'vergilius-lite': 'Vergilius Lite', 'full': 'Full' };
  var profili = document.getElementById('profili'), loader = document.getElementById('loader');
  var dial = document.getElementById('dial'), pct = document.getElementById('pct'), pname = document.getElementById('pname');
  var comp = document.getElementById('comp'), fase = document.getElementById('fase'), err = document.getElementById('err');
  var apri = document.getElementById('apri'), apriA = document.getElementById('apri-a'), sub = document.getElementById('sub');
  var hint = document.getElementById('hint'), avviso = document.getElementById('avviso');
  var resta = document.getElementById('resta'), cambia = document.getElementById('cambia');

  var profiloAttivo = null;   // profilo gia' scelto, secondo il server
  var inVolo = false;         // c'e' una POST /api/profile in corso
  var modoCambio = false;     // il proprietario sta scegliendo un profilo diverso
  var restaQui = false;       // ha chiesto di non essere portato via
  var confermaP = null, confermaT = 0;   // doppio clic di conferma per il cambio
  var redirectFatto = false;
  var dalLoad = {};           // id componente -> istante in cui lo vediamo "in caricamento"
  var timerConto = null, restano = 0, urlConto = '';
  var SECONDI_CONTO = 5;

  function abilitaProfili(vero) {
    Array.prototype.forEach.call(profili.querySelectorAll('.p'), function (x) { x.disabled = !vero; });
  }

  function avvisoTesto(html) {
    avviso.innerHTML = html;
    avviso.classList.add('on');
    var a = avviso.querySelector('[data-annulla]');
    if (a) a.addEventListener('click', annullaCambio);
  }

  function annullaCambio() {
    modoCambio = false; confermaP = null;
    profili.hidden = true;
    avviso.classList.remove('on'); avviso.innerHTML = '';
  }

  // Conto alla rovescia invece del salto immediato: il proprietario deve poter
  // leggere l'elenco dei componenti e decidere.
  function testoConto() {
    fase.textContent = 'Tutto pronto. Apro fra ' + restano + ' s: "Resta qui" ferma il conto.';
  }
  function avviaConto(url) {
    if (timerConto) return;
    urlConto = url; restano = SECONDI_CONTO; testoConto();
    timerConto = setInterval(function () {
      restano -= 1;
      if (restano <= 0) { fermaConto(); redirectFatto = true; window.location.replace(urlConto); return; }
      testoConto();
    }, 1000);
  }
  function fermaConto() {
    if (timerConto) { clearInterval(timerConto); timerConto = null; }
  }

  function render(s) {
    profiloAttivo = s.profile || null;

    if (s.phase === 'choose' && !modoCambio) {
      profili.hidden = false; abilitaProfili(!inVolo);
      loader.classList.remove('on'); apri.classList.remove('on');
      avviso.classList.remove('on');
      sub.textContent = 'Scegli cosa avviare. Finche\' non scegli, non parte nulla.';
      return;
    }

    profili.hidden = !modoCambio;
    loader.classList.add('on');
    sub.textContent = s.ready ? 'Pronto.' : 'Sto avviando ' + (NOMI[s.profile] || s.profile) + '…';
    pname.textContent = NOMI[s.profile] || s.profile;
    pct.textContent = s.progress + '%';
    dial.style.setProperty('--p', (s.progress * 3.6) + 'deg');

    var ora = Date.now(), lento = null;
    comp.innerHTML = '';
    (s.components || []).forEach(function (c) {
      var li = document.createElement('li'); li.className = c.status;
      li.innerHTML = '<span class="dot"></span><span class="lb"></span><span class="dt"></span>';
      li.querySelector('.lb').textContent = c.label;
      li.title = c.label;   // le etichette lunghe sono tagliate: il titolo le mostra intere
      var dt;
      if (c.status === 'error') { delete dalLoad[c.id]; dt = c.detail || 'errore'; }
      else if (c.status === 'ready') { delete dalLoad[c.id]; dt = c.detail || 'pronto'; }
      else {
        if (!dalLoad[c.id]) dalLoad[c.id] = ora;
        var sec = Math.round((ora - dalLoad[c.id]) / 1000);
        dt = (c.detail || 'caricamento…') + ' ' + sec + ' s';
        if (sec >= 60 && !lento) lento = c;
      }
      li.querySelector('.dt').textContent = dt;
      comp.appendChild(li);
    });

    if (lento) {
      hint.textContent = lento.blocking === false
        ? lento.label + ': questo feed dipende dalla rete esterna, Vergilius e\' gia\' utilizzabile e si completa da solo.'
        : lento.label + ': ci sta mettendo piu\' del solito, di norma si sblocca da solo.';
      hint.classList.add('on');
    } else hint.classList.remove('on');

    var errori = (s.components || []).filter(function (c) { return c.status === 'error'; });
    if (errori.length) { err.textContent = errori.map(function (c) { return c.label + ': ' + c.detail; }).join(' · '); err.classList.add('on'); }
    else err.classList.remove('on');

    if (s.ready) {
      apriA.href = s.target_url;
      apriA.textContent = 'Apri ' + (s.profile === 'shadowbroker' ? 'ShadowBroker' : 'Vergilius') + ' ora';
      apri.classList.add('on');
      if (!redirectFatto && !restaQui && !modoCambio) avviaConto(s.target_url);
      else if (!timerConto) fase.textContent = 'Tutto pronto. Il conto e\' fermo: apri quando vuoi.';
    } else {
      fermaConto();
      apri.classList.remove('on');
      fase.textContent = 'Il loader aspetta che ogni componente risponda davvero, non solo che la porta sia aperta.';
    }
  }

  function poll() {
    fetch('/api/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
      render(s);
      setTimeout(poll, s.ready ? 5000 : (s.profile ? 800 : 1600));
    }).catch(function () { setTimeout(poll, 1800); });
  }

  function manda(p, cambiando) {
    inVolo = true; abilitaProfili(false); confermaP = null;
    var corpo = cambiando ? { profile: p, change: true } : { profile: p };
    fetch('/api/profile', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || r.status); return j; }); })
      .then(function (s) {
        inVolo = false; modoCambio = false; restaQui = false; redirectFatto = false;
        dalLoad = {}; fermaConto();
        avviso.classList.remove('on'); avviso.innerHTML = '';
        abilitaProfili(true);
        render(s);
      })
      .catch(function (e) {
        inVolo = false; abilitaProfili(true);
        err.textContent = 'Avvio non riuscito: ' + e.message; err.classList.add('on');
      });
  }

  profili.addEventListener('click', function (ev) {
    var b = ev.target.closest('.p'); if (!b) return;
    if (inVolo) return;                               // una richiesta per volta
    if (profiloAttivo && !modoCambio) return;         // stack gia' avviato: il clic non fa nulla
    var p = b.getAttribute('data-p');
    if (modoCambio) {
      if (p === profiloAttivo) { annullaCambio(); return; }
      if (confermaP !== p || (Date.now() - confermaT) > 8000) {
        confermaP = p; confermaT = Date.now();
        avvisoTesto('Passare a <b>' + (NOMI[p] || p) + '</b> riavvia i servizi: le schede gia\' ' +
          'aperte su Vergilius si interrompono. Clicca di nuovo sulla stessa scheda per confermare, ' +
          'oppure <a href="#" data-annulla>annulla</a>.');
        return;
      }
    }
    manda(p, modoCambio);
  });

  resta.addEventListener('click', function () {
    restaQui = true; fermaConto();
    fase.textContent = 'Tutto pronto. Il conto e\' fermo: apri quando vuoi.';
  });

  cambia.addEventListener('click', function () {
    restaQui = true; fermaConto();
    modoCambio = true; confermaP = null;
    profili.hidden = false; abilitaProfili(true);
    avvisoTesto('Cambio profilo: scegli qui sotto. Il boot spegne i servizi che il nuovo profilo non usa e ' +
      'riavvia l\'assistente, quindi le chat aperte si interrompono. ' +
      '<a href="#" data-annulla>Annulla</a>.');
  });

  poll();
})();
</script>
</body>
</html>
